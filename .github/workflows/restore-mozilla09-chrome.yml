name: Restore Mozilla 0.9 chrome

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/restore-mozilla09-chrome.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motif-backend
          fetch-depth: 0

      - name: Download Mozilla 0.9 source
        run: |
          set -eux
          curl -fL --retry 4 \
            https://archive.mozilla.org/pub/mozilla/releases/mozilla0.9/src/mozilla-source-0.9.tar.gz \
            -o /tmp/mozilla-source-0.9.tar.gz
          mkdir -p /tmp/mozilla09-src
          tar -xzf /tmp/mozilla-source-0.9.tar.gz -C /tmp/mozilla09-src

      - name: Restore original Navigator and Communicator chrome
        run: |
          set -eux
          SRC=/tmp/mozilla09-src/mozilla
          APP=xulrunner/mozilla09
          NAV=$APP/chrome/navigator
          COMM=$APP/chrome/communicator

          mkdir -p "$NAV/content" "$NAV/locale" "$NAV/skin/classic"
          mkdir -p "$COMM/content" "$COMM/locale" "$COMM/skin/classic"
          mkdir -p "$APP/chrome/navigator-region/locale"
          mkdir -p "$APP/chrome/communicator-region/locale"

          cp -a "$SRC/xpfe/browser/resources/content/." "$NAV/content/"
          cp -f "$SRC/xpfe/browser/resources/content/unix/platformNavigationBindings.xul" "$NAV/content/platformNavigationBindings.xul"
          cp -a "$SRC/xpfe/browser/resources/locale/en-US/." "$NAV/locale/"
          cp -f "$SRC/xpfe/browser/resources/locale/en-US/region.properties" "$APP/chrome/navigator-region/locale/region.properties"

          cp -a "$SRC/xpfe/communicator/resources/content/." "$COMM/content/"
          cp -a "$SRC/xpfe/communicator/resources/locale/en-US/." "$COMM/locale/"
          cp -f "$SRC/xpfe/communicator/resources/content/unix/platformBrowserBindings.xul" "$COMM/content/platformBrowserBindings.xul"
          cp -f "$SRC/xpfe/communicator/resources/content/unix/platformEditorBindings.xul" "$COMM/content/platformEditorBindings.xul"
          cp -f "$SRC/xpfe/communicator/resources/content/unix/platformGlobalOverlay.xul" "$COMM/content/platformGlobalOverlay.xul"
          cp -f "$SRC/xpfe/communicator/resources/locale/en-US/region.dtd" "$APP/chrome/communicator-region/locale/region.dtd"
          cp -f "$SRC/xpfe/communicator/resources/locale/en-US/taskbar.rdf" "$APP/chrome/communicator-region/locale/taskbar.rdf"

          mkdir -p "$COMM/content/sidebar" "$COMM/locale/sidebar"
          cp -a "$SRC/xpfe/components/sidebar/resources/." "$COMM/content/sidebar/"
          find "$SRC/xpfe/components/sidebar/resources" -path '*/locale/*' -type f \( -name '*.dtd' -o -name '*.properties' \) -exec cp -f {} "$COMM/locale/sidebar/" \;

          mkdir -p "$COMM/content/bookmarks" "$COMM/locale/bookmarks"
          cp -a "$SRC/xpfe/components/bookmarks/resources/." "$COMM/content/bookmarks/"
          find "$SRC/xpfe/components/bookmarks/resources" -path '*/locale/*' -type f \( -name '*.dtd' -o -name '*.properties' \) -exec cp -f {} "$COMM/locale/bookmarks/" \;

          cp -f "$SRC/netwerk/resources/content/securityOverlay.xul" "$COMM/content/securityOverlay.xul"
          cp -f "$SRC/netwerk/resources/content/securityUI.js" "$COMM/content/securityUI.js"
          cp -f "$SRC/netwerk/resources/content/PSMTaskMenu.xul" "$COMM/content/PSMTaskMenu.xul"
          cp -f "$SRC/netwerk/resources/locale/en-US/PSMTaskMenu.dtd" "$COMM/locale/PSMTaskMenu.dtd"
          cp -f "$SRC/netwerk/resources/locale/en-US/security.properties" "$COMM/locale/security.properties"
          cp -f "$SRC/netwerk/resources/locale/en-US/securityOverlay.dtd" "$COMM/locale/securityOverlay.dtd"

          cp -a "$SRC/themes/classic/navigator/." "$NAV/skin/classic/"
          cp -a "$SRC/themes/classic/navigator/win/." "$NAV/skin/classic/"
          cp -a "$SRC/themes/classic/communicator/." "$COMM/skin/classic/"
          cp -a "$SRC/themes/classic/communicator/win/." "$COMM/skin/classic/"
          cp -a "$SRC/themes/classic/communicator/bookmarks/win/." "$COMM/skin/classic/bookmarks/"
          cp -a "$SRC/themes/classic/communicator/sidebar/win/." "$COMM/skin/classic/sidebar/"

          sed -i '/onkeypress="if (event.keyCode == 13) { addToUrlbarHistory(); BrowserLoadURL(); }" flex="1"\/>/d' "$NAV/content/navigator.xul"

          find "$APP/chrome" -type d -name CVS -prune -exec rm -rf {} +
          find "$APP/chrome" -type f \( -name 'Makefile.in' -o -name 'makefile.win' -o -name 'jar.mn' -o -name 'MANIFEST' -o -name '.cvsignore' -o -name 'contents.rdf' \) -delete

          cat > "$APP/chrome.manifest" <<'EOF'
          content navigator chrome/navigator/content/
          locale navigator en-US chrome/navigator/locale/
          skin navigator classic/1.0 chrome/navigator/skin/classic/
          content communicator chrome/communicator/content/
          locale communicator en-US chrome/communicator/locale/
          skin communicator classic/1.0 chrome/communicator/skin/classic/
          locale navigator-region en-US chrome/navigator-region/locale/
          locale communicator-region en-US chrome/communicator-region/locale/
          EOF

      - name: Commit restored chrome to motif-backend
        run: |
          set -eux
          git config user.name "db2k"
          git config user.email "33785843+gazecube@users.noreply.github.com"
          git add xulrunner/mozilla09
          if git diff --cached --quiet; then
            echo "No chrome changes to commit"
            exit 0
          fi
          git commit -m "Restore full Mozilla 0.9 Navigator chrome sources"
          git push origin HEAD:motif-backend
